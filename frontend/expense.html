<!DOCTYPE html>
<html>
<head>
    <title>Add Expense</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h2>Add Expense</h2>
    <input type="date" id="expense_date">
    <input type="number" id="amount" placeholder="Amount">
    <input type="text" id="category" placeholder="Category">
    <input type="text" id="payment_method" placeholder="Payment Method">
    <textarea id="description" placeholder="Description"></textarea>
    <button onclick="addExpense()">Add Expense</button>
    <button onclick="window.location.href='dashboard.html'">Back to Dashboard</button>
</div>

<script>
async function addExpense() {
    const user = JSON.parse(localStorage.getItem("user"));

    const expense_date = document.getElementById("expense_date").value;
    const amount = document.getElementById("amount").value;
    const category = document.getElementById("category").value;
    const payment_method = document.getElementById("payment_method").value;
    const description = document.getElementById("description").value;

    const res = await fetch("http://localhost:5000/expenses/add", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            user_id: user.id,
            expense_date,
            amount,
            category,
            payment_method,
            description
        })
    });

    const data = await res.json();
    alert(data.message || data.error);
}
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Expense - TrackWise</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h2 id="pageTitle">Add Expense</h2>

    <input type="date" id="expense_date">
    <input type="number" id="amount" placeholder="Amount">
    <select id="category"></select>
    <input type="text" id="payment_method" placeholder="Payment Method">
    <textarea id="description" placeholder="Description"></textarea>
    <input type="file" id="receipt">

    <button onclick="saveExpense()">Save Expense</button>
    <button onclick="window.location.href='dashboard.html'">Back to Dashboard</button>
</div>

<script>
const user = JSON.parse(localStorage.getItem("user"));
if (!user) window.location.href = "login.html";

const urlParams = new URLSearchParams(window.location.search);
const expenseId = urlParams.get("id");

async function applySavedTheme() {
    try {
        const res = await fetch(`http://localhost:5000/settings/${user.id}`);
        const data = await res.json();
        if (data.theme === "light") document.body.classList.add("light-theme");
        else document.body.classList.remove("light-theme");
    } catch (e) {}
}

async function loadCategories() {
    const res = await fetch(`http://localhost:5000/categories/all/${user.id}`);
    const data = await res.json();

    const categorySelect = document.getElementById("category");
    categorySelect.innerHTML = `<option value="">Select Category</option>`;

    data.forEach(cat => {
        categorySelect.innerHTML += `<option value="${cat.category_name}">${cat.category_name}</option>`;
    });

    const defaultCategories = ["Food", "Travel", "Shopping", "Bills", "Entertainment", "Health", "Education", "Others"];
    defaultCategories.forEach(cat => {
        if (![...categorySelect.options].some(opt => opt.value === cat)) {
            categorySelect.innerHTML += `<option value="${cat}">${cat}</option>`;
        }
    });
}

async function loadExpenseForEdit() {
    if (!expenseId) return;

    document.getElementById("pageTitle").innerText = "Edit Expense";

    const res = await fetch(`http://localhost:5000/expenses/one/${expenseId}`);
    const data = await res.json();

    document.getElementById("expense_date").value = data.expense_date?.split("T")[0] || data.expense_date;
    document.getElementById("amount").value = data.amount;
    document.getElementById("category").value = data.category;
    document.getElementById("payment_method").value = data.payment_method;
    document.getElementById("description").value = data.description || "";
}

async function saveExpense() {
    const expense_date = document.getElementById("expense_date").value;
    const amount = document.getElementById("amount").value;
    const category = document.getElementById("category").value;
    const payment_method = document.getElementById("payment_method").value;
    const description = document.getElementById("description").value;

    if (!expense_date || !amount || !category || !payment_method) {
        alert("Fill all required fields");
        return;
    }

    if (Number(amount) <= 0) {
        alert("Amount must be greater than 0");
        return;
    }

    const formData = new FormData();
    formData.append("user_id", user.id);
    formData.append("expense_date", expense_date);
    formData.append("amount", amount);
    formData.append("category", category);
    formData.append("payment_method", payment_method);
    formData.append("description", description);

    const fileInput = document.getElementById("receipt");
    if (fileInput.files.length > 0) {
        formData.append("receipt", fileInput.files[0]);
    }

    let url = "http://localhost:5000/expenses/add";
    let method = "POST";

    if (expenseId) {
        url = `http://localhost:5000/expenses/update/${expenseId}`;
        method = "PUT";
    }

    const res = await fetch(url, { method, body: formData });
    const data = await res.json();
    alert(data.message || data.error);

    if (data.message) {
        window.location.href = "dashboard.html";
    }
}

(async function () {
    await applySavedTheme();
    await loadCategories();
    await loadExpenseForEdit();
})();
</script>
</body>
</html>
